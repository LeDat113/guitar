<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lava Genie Pro - Local Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --primary: #ffaa00; --bg: #121212; --panel: #252525; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .screen {
            background: #000; width: 100%; max-width: 500px; height: 100px;
            border-radius: 20px; border: 2px solid #333; margin: 20px 0;
            display: flex; align-items: center; padding: 0 15px; overflow-x: auto;
            box-shadow: inset 0 0 15px rgba(255,170,0,0.1);
        }
        .chord-card {
            background: #222; min-width: 60px; height: 60px; margin-right: 12px;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 20px; color: #444; border: 1px solid #333; transition: 0.2s;
        }
        .chord-card.active { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); transform: scale(1.1); }
        .chord-card.added { color: #eee; border-color: #555; }
        .controls { background: var(--panel); padding: 20px; border-radius: 25px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .group-label { font-size: 12px; color: #777; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        button { border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; background: #333; color: #ccc; }
        button:active { transform: scale(0.95); }
        button.style-btn.selected { background: #eee; color: #000; }
        .play-btn { width: 100%; padding: 18px; border-radius: 15px; font-size: 18px; background: #27ae60; color: white; }
        .play-btn.stop { background: #e74c3c; }
        #status { font-size: 10px; text-align: center; margin-top: 10px; color: #555; }
    </style>
</head>
<body>

<h2 style="color: var(--primary); font-style: italic;">LAVA GENIE PRO</h2>

<div class="screen" id="display">
    <div style="color: #333; width: 100%; text-align: center;">Đang đợi nạp âm thanh...</div>
</div>

<div class="controls">
    <span class="group-label">Chọn vòng hợp âm</span>
    <div class="btn-grid">
        <button onclick="add('C')">C</button>
        <button onclick="add('G')">G</button>
        <button onclick="add('Am')">Am</button>
        <button onclick="add('F')">F</button>
        <button onclick="add('Em')">Em</button>
        <button onclick="add('Dm')">Dm</button>
        <button onclick="undo()" style="background: #444;">↩</button>
        <button onclick="reset()" style="color: #e74c3c;">Xóa</button>
    </div>

    <span class="group-label">Chọn điệu</span>
    <div class="btn-grid" style="grid-template-columns: repeat(3, 1fr);">
        <button class="style-btn selected" onclick="setStyle('quạt', this)">Quạt Chả</button>
        <button class="style-btn" onclick="setStyle('tỉa', this)">Tỉa 4/4</button>
        <button class="style-btn" onclick="setStyle('fox', this)">Điệu Fox</button>
    </div>

    <button class="play-btn" id="playBtn" onclick="run()">ĐANG NẠP FILE... ⏳</button>
    <div id="status">Vui lòng dùng Firefox hoặc Host lên GitHub để có tiếng</div>
</div>

<script>
    // 1. KHỞI TẠO SAMPLER DÙNG FILE LOCAL
    const sampler = new Tone.Sampler({
        urls: {
            "A1": "A1.mp3",
            "A2": "A2.mp3",
            "A3": "A3.mp3",
            "A4": "A4.mp3",
            "A5": "A5.mp3",
            "A6": "A6.mp3"
        },
        baseUrl: "./guitar/", 
        onload: () => { 
            document.getElementById('playBtn').innerText = "CHẠY VÒNG LẶP ▶";
            document.getElementById('display').innerHTML = '<div style="color: #333; width: 100%; text-align: center;">Sẵn sàng! Chọn hợp âm đi.</div>';
        }
    }).toDestination();

    const reverb = new Tone.Reverb(1.5).toDestination();
    sampler.connect(reverb);

    const CHORDS = {
        'C': ["C3", "E3", "G3", "C4", "E4"],
        'G': ["G2", "B2", "D3", "G3", "B3", "G4"],
        'Am':["A2", "E3", "A3", "C4", "E4"],
        'F': ["F2", "C3", "F3", "A3", "C4"],
        'Em':["E2", "B2", "E3", "G3", "B3", "E4"],
        'Dm':["D3", "A3", "D4", "F4"]
    };

    const STYLES = {
        'quạt': [
            { t: "0:0:0", type: "down" }, { t: "0:1:0", type: "down" }, 
            { t: "0:1:2", type: "up" }, { t: "0:2:2", type: "up" }, 
            { t: "0:3:0", type: "down" }, { t: "0:3:2", type: "up" }
        ],
        'tỉa': [
            { t: "0:0:0", s: 0 }, { t: "0:0:2", s: 2 }, { t: "0:1:0", s: 3 }, 
            { t: "0:1:2", s: 4 }, { t: "0:2:0", s: 3 }, { t: "0:2:2", s: 2 },
            { t: "0:3:0", s: 4 }, { t: "0:3:2", s: 3 }
        ],
        'fox': [
            { t: "0:0:0", s: 0 }, { t: "0:0:2", type: "short" }, 
            { t: "0:1:0", s: 1 }, { t: "0:1:2", type: "short" },
            { t: "0:2:0", s: 0 }, { t: "0:2:2", type: "short" },
            { t: "0:3:0", s: 1 }, { t: "0:3:2", type: "short" }
        ]
    };

    let queue = [];
    let currentStyle = 'quạt';
    let step = 0;
    let playing = false;

    function add(c) { queue.push(c); render(); }
    function undo() { queue.pop(); render(); }
    function reset() { queue = []; stop(); render(); }
    function setStyle(s, b) {
        currentStyle = s;
        document.querySelectorAll('.style-btn').forEach(btn => btn.classList.remove('selected'));
        b.classList.add('selected');
    }

    function render() {
        const d = document.getElementById('display');
        d.innerHTML = queue.length ? '' : '<div style="color: #333; width: 100%; text-align: center;">Chưa có hợp âm...</div>';
        queue.forEach((c, i) => {
            const div = document.createElement('div');
            div.className = `chord-card added ${i === step && playing ? 'active' : ''}`;
            div.innerText = c;
            d.appendChild(div);
        });
    }

    async function run() {
        if (playing) { stop(); return; }
        if (!queue.length) return;
        
        await Tone.start();
        playing = true;
        step = 0;
        document.getElementById('playBtn').innerText = "DỪNG LẠI ■";
        document.getElementById('playBtn').classList.add('stop');

        Tone.Transport.bpm.value = currentStyle === 'fox' ? 120 : 90;
        Tone.Transport.scheduleRepeat(time => {
            const chord = CHORDS[queue[step]];
            const pattern = STYLES[currentStyle];
            
            Tone.Draw.schedule(() => render(), time);

            pattern.forEach(p => {
                const playTime = time + Tone.Time(p.t);
                if (p.type === 'down') {
                    chord.forEach((n, i) => sampler.triggerAttackRelease(n, "2n", playTime + i*0.04));
                } else if (p.type === 'up') {
                    [...chord].reverse().forEach((n, i) => sampler.triggerAttackRelease(n, "2n", playTime + i*0.03));
                } else if (p.type === 'short') {
                    sampler.triggerAttackRelease(chord.slice(-3), "16n", playTime);
                } else {
                    sampler.triggerAttackRelease(chord[p.s] || chord[0], "2n", playTime);
                }
            });
            step = (step + 1) % queue.length;
        }, "1m");
        
        Tone.Transport.start();
    }

    function stop() {
        playing = false;
        Tone.Transport.stop();
        Tone.Transport.cancel();
        document.getElementById('playBtn').innerText = "CHẠY VÒNG LẶP ▶";
        document.getElementById('playBtn').classList.remove('stop');
        render();
    }
</script>
</body>
</html>
