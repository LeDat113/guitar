<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Guitar Hybrid Pro v16</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root { --gold: #ffca28; --bg: #0a0a0a; --card: #1a1a1a; --green: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .screen {
            background: #000; width: 100%; max-width: 700px; height: 90px;
            border-radius: 20px; border: 2px solid #333; margin-bottom: 20px;
            display: flex; align-items: center; padding: 0 20px; overflow-x: auto; gap: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .chord-tag {
            background: #252525; min-width: 60px; height: 60px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 20px; color: #555; border: 1px solid #333;
        }
        .chord-tag.active { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); border: none; }
        .main-container { background: var(--card); padding: 25px; border-radius: 30px; width: 100%; max-width: 700px; }
        .chord-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 25px; }
        .chord-btn { 
            position: relative; height: 75px; background: #2a2a2a; border: none; 
            border-radius: 15px; cursor: pointer; border-bottom: 4px solid #000; transition: 0.1s;
        }
        .chord-btn:active { transform: translateY(3px); border-bottom-width: 1px; }
        .chord-btn .name { font-size: 22px; font-weight: bold; color: var(--gold); }
        .chord-btn .add-btn { 
            position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; 
            background: #444; border-radius: 5px; font-size: 14px; color: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .style-btn { padding: 15px; border-radius: 12px; background: #333; color: #888; border: none; cursor: pointer; font-weight: bold; font-size: 13px; }
        .style-btn.selected { background: #fff; color: #000; }
        .tempo-box { margin-bottom: 20px; background: #222; padding: 15px; border-radius: 15px; text-align: center; }
        input[type=range] { width: 80%; cursor: pointer; accent-color: var(--gold); }
        .action-bar { display: flex; gap: 10px; }
        .play-btn { flex: 4; padding: 20px; border-radius: 15px; font-size: 20px; background: var(--green); color: white; border: none; cursor: pointer; font-weight: bold; }
        .play-btn.stop { background: #e74c3c; }
        .clear-btn { flex: 1; background: #444; color: white; border-radius: 15px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<h1 style="color: var(--gold); font-style: italic; letter-spacing: 2px;">GUITAR HYBRID v16</h1>

<div class="screen" id="display">
    <div style="color: #222; width: 100%; text-align: center;">Chạm (+) để thiết lập vòng lặp</div>
</div>

<div class="main-container">
    <div class="chord-grid" id="chordGrid"></div>

    <div class="tempo-box">
        <label style="font-size: 12px; color: #888;">TEMPO: <span id="tempoVal">90</span> BPM</label><br>
        <input type="range" min="60" max="180" value="90" oninput="updateTempo(this.value)">
    </div>

    <div class="style-grid" id="styleGrid"></div>

    <div class="action-bar">
        <button class="play-btn" id="playBtn" onclick="toggleLoop()">NẠP ÂM THANH... ⏳</button>
        <button class="clear-btn" onclick="resetAll()">XÓA</button>
    </div>
</div>

<script>
    const CHORDS_DATA = {
        'C': ["C3","E3","G3","C4","E4"], 'Cm': ["C3","D#3","G3","C4","D#4"], 'C7': ["C3","E3","G3","A#3","C4"],
        'D': ["D3","A3","D4","F#4"], 'Dm': ["D3","A3","D4","F4"], 'D7': ["D3","A3","C4","F#4"],
        'E': ["E2","B2","E3","G#3","B3","E4"], 'Em': ["E2","B2","E3","G3","B3","E4"], 'E7': ["E2","B2","D3","G#3","D4"],
        'F': ["F2","C3","F3","A3","C4"], 'Fm': ["F2","C3","F3","G#3","C4"], 'F7': ["F2","C3","D#3","A3","C4"],
        'G': ["G2","B2","D3","G3","B3","G4"], 'Gm': ["G2","A#2","D3","G3","A#3","D4"], 'G7': ["G2","B2","D3","F3","B3","D4"],
        'A': ["A2","E3","A3","C#4","E4"], 'Am': ["A2","E3","A3","C4","E4"], 'A7': ["A2","E3","G3","C#4","E4"],
        'B': ["B2","F#3","B3","D#4","F#4"], 'Bm': ["B2","F#3","B3","D4","F#4"], 'B7': ["B2","D#3","A3","D#4","F#4"],
        'Bb':["A#2","F3","A#3","D4","F4"], 'Eb':["D#3","A#3","D#4","G4"], 'Ab':["G#2","D#3","G#3","C4","D#4"]
    };

    const STYLES_DATA = {
        'Quạt Ballad': [ {t:"0:0:0",type:"down"}, {t:"0:1:0",type:"down"}, {t:"0:1:2",type:"up"}, {t:"0:2:2",type:"up"}, {t:"0:3:0",type:"down"}, {t:"0:3:2",type:"up"} ],
        'Rải 1: b321323': [ {t:"0:0:0",s:0}, {t:"0:0:2",s:2}, {t:"0:1:0",s:3}, {t:"0:1:2",s:4}, {t:"0:2:1",s:2}, {t:"0:2:3",s:3}, {t:"0:3:1",s:2} ],
        'Rải 2: b3231323': [ {t:"0:0:0",s:0}, {t:"0:0:2",s:2}, {t:"0:1:0",s:3}, {t:"0:1:2",s:2}, {t:"0:2:0",s:4}, {t:"0:2:2",s:2}, {t:"0:3:0",s:3}, {t:"0:3:2",s:2} ],
        'Disco': [ {t:"0:0:0",type:"down"}, {t:"0:0:2",type:"up"}, {t:"0:1:0",type:"down"}, {t:"0:1:2",type:"up"}, {t:"0:2:0",type:"down"}, {t:"0:2:2",type:"up"}, {t:"0:3:0",type:"down"}, {t:"0:3:2",type:"up"} ],
        'Bolero': [ {t:"0:0:0",s:0}, {t:"0:1:0",type:"down"}, {t:"0:1:2",type:"up"}, {t:"0:2:0",type:"down"}, {t:"0:2:2",type:"up"}, {t:"0:3:0",type:"down"} ],
        'Slow Rock': [ {t:"0:0:0",s:0}, {t:"0:0:1.3",s:2}, {t:"0:0:2.6",s:3}, {t:"0:1:0",s:4}, {t:"0:1:1.3",s:3}, {t:"0:1:2.6",s:2} ]
    };

    const sampler = new Tone.Sampler({
        urls: { "A1":"A1.mp3", "A2":"A2.mp3", "A3":"A3.mp3", "A4":"A4.mp3", "A5":"A5.mp3" },
        baseUrl: "./guitar/",
        onload: () => { document.getElementById('playBtn').innerText = "CHẠY VÒNG LẶP ▶"; }
    }).toDestination();
    sampler.connect(new Tone.Reverb(1.2).toDestination());

    let queue = [], currentStyle = 'Quạt Ballad', step = 0, playing = false, bpm = 90;

    const grid = document.getElementById('chordGrid');
    Object.keys(CHORDS_DATA).forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'chord-btn';
        btn.innerHTML = `<span class="name">${name}</span><div class="add-btn" onclick="addToQueue(event, '${name}')">+</div>`;
        btn.onclick = () => playNow(name);
        grid.appendChild(btn);
    });

    const sGrid = document.getElementById('styleGrid');
    Object.keys(STYLES_DATA).forEach(s => {
        const b = document.createElement('button');
        b.className = `style-btn ${s === currentStyle ? 'selected' : ''}`;
        b.innerText = s;
        b.onclick = () => {
            currentStyle = s;
            document.querySelectorAll('.style-btn').forEach(x => x.classList.remove('selected'));
            b.classList.add('selected');
        };
        sGrid.appendChild(b);
    });

    function updateTempo(v) {
        bpm = v;
        document.getElementById('tempoVal').innerText = v;
        if (playing) Tone.Transport.bpm.value = v;
    }

    async function playNow(name) {
        await Tone.start();
        if (playing) return;
        executeChord(name, Tone.now());
    }

    function addToQueue(e, name) {
        e.stopPropagation();
        queue.push(name);
        renderDisplay();
    }

    function executeChord(name, time) {
        const notes = CHORDS_DATA[name];
        const pattern = STYLES_DATA[currentStyle];
        pattern.forEach(p => {
            const pTime = time + Tone.Time(p.t);
            if (p.type === 'down') notes.forEach((n, i) => sampler.triggerAttackRelease(n, "2n", pTime + i*0.045, 0.7));
            else if (p.type === 'up') [...notes].reverse().forEach((n, i) => sampler.triggerAttackRelease(n, "2n", pTime + i*0.03, 0.4));
            else sampler.triggerAttackRelease(notes[p.s] || notes[0], "1n", pTime, 0.8);
        });
    }

    function renderDisplay() {
        const d = document.getElementById('display');
        d.innerHTML = queue.length ? '' : '<div style="color: #222; width: 100%; text-align: center;">Vòng lặp trống</div>';
        queue.forEach((c, i) => {
            const tag = document.createElement('div');
            tag.className = `chord-tag ${i === step && playing ? 'active' : ''}`;
            tag.innerText = c;
            d.appendChild(tag);
        });
    }

    async function toggleLoop() {
        if (playing) { stopLoop(); return; }
        if (!queue.length) return;
        await Tone.start();
        playing = true; step = 0;
        document.getElementById('playBtn').innerText = "DỪNG LẠI ■";
        document.getElementById('playBtn').classList.add('stop');
        Tone.Transport.bpm.value = bpm;
        Tone.Transport.scheduleRepeat(time => {
            executeChord(queue[step], time);
            Tone.Draw.schedule(() => renderDisplay(), time);
            step = (step + 1) % queue.length;
        }, "1m");
        Tone.Transport.start();
    }

    function stopLoop() {
        playing = false; Tone.Transport.stop(); Tone.Transport.cancel();
        document.getElementById('playBtn').innerText = "CHẠY VÒNG LẶP ▶";
        document.getElementById('playBtn').classList.remove('stop');
        renderDisplay();
    }

    function resetAll() { queue = []; stopLoop(); renderDisplay(); }
</script>
</body>
</html>
